{% extends 'base.html' %}

{% block title %}Access Forbidden (403){% endblock %}

{% block content %}
<div class="form-container" style="text-align: center;">
  <div class="card" style="padding: 3rem 2rem;">
    <div style="width: 56px; height: 56px; background-color: var(--status-rejected-bg); color: var(--status-rejected-text); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem auto;">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    </div>
    <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--teal-deep); margin-bottom: 0.5rem;">
      403 — Access Forbidden
    </h1>
    <p style="color: var(--text-secondary); max-width: 480px; margin: 0 auto 1.5rem auto; line-height: 1.5;">
      You do not have permission to access this resource. If you are an administrator, please sign in with an authorized account.
    </p>
    <div>
      <a href="{{ url_for('admin.login') }}" class="btn btn-primary">Administrator Login</a>
      <a href="{{ url_for('public.index') }}" class="btn btn-secondary" style="margin-left: 0.5rem;">Return Home</a>
    </div>
  </div>
</div>
{% endblock %}
